name: Release

on:
  push:
    branches: [main, next]
  workflow_dispatch:

concurrency:
  group: semantic-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Publish: npm Trusted Publisher (OIDC, workflow file must be `release.yml` on npmjs.com)
    # or NPM_TOKEN (Granular Automation). Do not set setup-node `registry-url` here.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify npm token (whoami)
        if: env.NPM_TOKEN != ''
        run: |
          npm config set //registry.npmjs.org/:_authToken="${NPM_TOKEN}"
          npm whoami
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
