name: Release

on:
  push:
    branches: [main, next]
  workflow_dispatch:

concurrency:
  group: semantic-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # setup-node writes .npmrc using NODE_AUTH_TOKEN during that step — it must be set *before*
    # Setup Node, not only on the semantic-release step (otherwise auth is empty and npm falls back to OTP).
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require NPM_TOKEN secret
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::Repository secret NPM_TOKEN is missing or empty"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
