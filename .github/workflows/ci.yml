name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks (Linux)
        if: runner.os == 'Linux'
        run: npm run check

      - name: Run checks (macOS/Windows)
        if: runner.os != 'Linux'
        run: npm run lint && npm run test:unit && node bin/jwebgen.js --help && node bin/jwebgen.js --new myapp --yes

      - name: Verify package
        run: npm pack --dry-run
